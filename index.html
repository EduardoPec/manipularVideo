<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="video-container">
        <video id="my-video" controls autoplay>
            <source src="video/Tema.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div id="buttons-container">
        <button id="play-pause-button">▶ Play/Pause</button>
        <button id="stop-button">⏹ Stop</button>
        <button id="mute-unmute-button">🔇 Mute/Unmute</button>
        <button id="download-button">⬇ Download</button>
        <button id="like-button">👍 Like</button>
        <button id="unlike-button">👎 Unlike</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
